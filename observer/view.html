<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Splunk Lab Observer</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b1220; color: #e6edf7;
      --line: #344154; --muted: #a8b5c7; --panel: #111c2e; --button: #1f3652; --button-line: #55718e;
      --ok-bg: #173f31; --ok: #a6f3c6; --warn-bg: #534516; --warn: #ffe79a; --bad-bg: #572a2a; --bad: #ffc0c0; --link: #8fc2ff; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
    header { display: flex; gap: 1rem; align-items: center; justify-content: space-between; padding: .7rem 1.1rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    h1 { margin: 0; font-size: 1.05rem; }
    h2 { font-size: 1rem; margin: 1.2rem 0 .5rem; }
    .subtitle, .muted { color: var(--muted); font-size: .85rem; }
    .row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
    button, select, input, textarea { font: inherit; }
    button, select { background: var(--button); color: #f5f8fc; border: 1px solid var(--button-line); border-radius: .35rem; padding: .35rem .6rem; cursor: pointer; }
    button:hover { background: #2b4b70; }
    button.small { padding: .1rem .4rem; font-size: .8rem; }
    button[aria-pressed="true"] { background: #2f5d8f; border-color: #8fb8e6; }
    a { color: var(--link); }
    nav { display: flex; gap: .3rem; padding: .5rem 1.1rem 0; border-bottom: 1px solid var(--line); }
    nav button { border-radius: .35rem .35rem 0 0; border-bottom: 0; background: transparent; }
    nav button[aria-selected="true"] { background: var(--panel); border-color: var(--line); }
    main { flex: 1; min-height: 0; overflow: auto; padding: .8rem 1.1rem 1.5rem; position: relative; }
    .badge { display: inline-block; border-radius: 1rem; padding: .05rem .5rem; font-size: .78rem; background: #26344a; color: #d5deea; white-space: nowrap; }
    .badge.ok { background: var(--ok-bg); color: var(--ok); }
    .badge.warn { background: var(--warn-bg); color: var(--warn); }
    .badge.bad { background: var(--bad-bg); color: var(--bad); }
    .badge.owner { background: #3b2d5c; color: #e1d2ff; }
    /* wall */
    .toolbar { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-bottom: .7rem; }
    .picker { border: 1px solid var(--line); border-radius: .5rem; background: var(--panel); padding: .6rem .8rem; margin-bottom: .8rem; columns: 17rem; column-gap: 1.5rem; }
    .picker section { break-inside: avoid; margin-bottom: .6rem; }
    .picker h3 { margin: 0 0 .3rem; font-size: .85rem; color: var(--muted); font-weight: 600; }
    .picker label { display: flex; gap: .4rem; align-items: center; font-size: .88rem; padding: .15rem 0; }
    .picker .pick-name { flex: 1; min-width: 0; }
    .picker .pick-host { display: block; font-size: .72rem; }
    .wall[hidden], [hidden] { display: none !important; }
    .wall { display: grid; gap: .8rem; grid-template-columns: repeat(var(--columns, 3), minmax(0, 1fr)); }
    .tile { border: 1px solid var(--line); border-radius: .5rem; background: var(--panel); display: flex; flex-direction: column; min-width: 0; }
    .tile.dragging { opacity: .4; }
    .tile.drop-target { outline: 2px dashed #8fb8e6; }
    .tile-head { display: flex; align-items: center; flex-wrap: wrap; gap: .3rem .4rem; padding: .35rem .5rem; border-bottom: 1px solid var(--line); cursor: grab; min-width: 0; }
    .tile-head .name { font-weight: 600; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 0 100%; min-width: 0; }
    .tile-head .spacer { flex: 1; }
    .tile-body { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #f8f9fb; border-radius: 0 0 .5rem .5rem; }
    .tile-body iframe { position: absolute; top: 0; left: 0; border: 0; background: white; transform-origin: 0 0; }
    .tile-body img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
    .tile-foot { font-size: .75rem; color: var(--muted); padding: .3rem .5rem; border-top: 1px solid var(--line); }
    .empty { position: absolute; inset: 0; display: grid; place-items: center; background: #101b2c; color: var(--muted); text-align: center; padding: 1rem; font-size: .9rem; }
    .console { position: absolute; inset: 0; background: #070c16; color: #cfe3ff; font: .72rem/1.35 ui-monospace, monospace; padding: .5rem; overflow: auto; white-space: pre-wrap; }
    .focus { position: fixed; inset: 0; z-index: 20; background: rgba(5, 9, 18, .92); display: flex; flex-direction: column; padding: 1rem; gap: .5rem; }
    .focus .tile-body { flex: 1; aspect-ratio: auto; border: 1px solid var(--line); border-radius: .5rem; }
    .focus-main { flex: 1; min-height: 0; display: flex; gap: .6rem; }
    .screens { width: 17rem; flex: none; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: .5rem; padding: .5rem; }
    .screens input { width: 100%; background: #0b1220; color: white; border: 1px solid #69809a; border-radius: .35rem; padding: .35rem; margin-bottom: .4rem; }
    .screens h4 { margin: .6rem 0 .2rem; font-size: .78rem; color: var(--muted); font-weight: 600; }
    .screens button.screen { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-radius: .3rem; padding: .2rem .4rem; font-size: .85rem; }
    .screens button.screen:hover { background: #1b2c45; }
    .screens button.screen[aria-current="true"] { background: #2f5d8f; }
    .timebar input[type=range] { flex: 1; min-width: 12rem; }
    .timebar input[type=datetime-local] { background: #0b1220; color: white; border: 1px solid #69809a; border-radius: .35rem; padding: .25rem; }
    .history-note { border: 1px solid #3d5f8a; background: #10213a; border-radius: .4rem; padding: .5rem .7rem; font-size: .85rem; margin-bottom: .7rem; }
    .history-note details { margin-top: .4rem; }
    /* overview */
    .groups { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr)); }
    .card { border: 1px solid var(--line); border-radius: .5rem; background: var(--panel); padding: .7rem .8rem; }
    .card h3 { margin: 0 0 .3rem; font-size: .95rem; }
    .chips { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .4rem; }
    .chip { border: 1px solid var(--line); border-radius: .35rem; padding: .15rem .45rem; font-size: .8rem; background: #0d1626; cursor: pointer; color: inherit; }
    table { border-collapse: collapse; width: 100%; font-size: .85rem; }
    th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #243246; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: #0b1220; }
    tr.clickable:hover { background: #142238; cursor: pointer; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(40rem, 100%); background: #0e1828; border-left: 1px solid var(--line); z-index: 30; overflow: auto; padding: 1rem 1.1rem 2rem; box-shadow: -1rem 0 2rem rgba(0,0,0,.4); }
    .drawer pre { background: #070c16; padding: .6rem; border-radius: .35rem; overflow: auto; font-size: .75rem; max-height: 22rem; }
    .drawer input, .drawer textarea { width: 100%; background: #0b1220; color: white; border: 1px solid #69809a; border-radius: .35rem; padding: .4rem; }
    .fact-source { color: var(--muted); font-size: .75rem; }
    .notice { border: 1px solid #6d5a1d; background: #2b2410; color: var(--warn); border-radius: .4rem; padding: .5rem .7rem; font-size: .85rem; margin-bottom: .7rem; }
    @media (max-width: 900px) { .wall { grid-template-columns: minmax(0, 1fr) !important; } }
    /* assistant */
    :root { --assistant-width: min(30rem, 100vw); }
    body.with-assistant { padding-right: var(--assistant-width); }
    body.with-assistant .focus { right: var(--assistant-width); }
    .assistant { position: fixed; top: 0; right: 0; bottom: 0; width: var(--assistant-width); z-index: 25; background: #0e1828; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
    .assistant-head { padding: .6rem .8rem; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: .4rem; }
    .assistant-head select { max-width: 100%; }
    .trail { flex: 1; min-height: 0; overflow: auto; padding: .7rem .8rem; display: flex; flex-direction: column; gap: .5rem; font-size: .88rem; }
    .step { border-radius: .45rem; padding: .45rem .6rem; background: #111c2e; border: 1px solid #243246; white-space: pre-wrap; overflow-wrap: anywhere; }
    .step.you { background: #1d3150; border-color: #33557f; align-self: flex-end; max-width: 90%; }
    .step.claude { background: transparent; border: 0; padding: .1rem .1rem; }
    .step.tool, .step.display { font-size: .8rem; white-space: normal; }
    .step.display { border-color: #3d5f8a; background: #10213a; }
    .step.error { border-color: #7b3b3b; background: #2a1414; color: var(--bad); }
    .step.approval { border: 1px solid #a1842c; background: #2b2410; white-space: normal; }
    .step.approval dl { margin: .3rem 0; display: grid; grid-template-columns: max-content 1fr; gap: .15rem .6rem; }
    .step.approval dt { color: var(--muted); }
    .step.approval dd { margin: 0; }
    .step details summary { cursor: pointer; color: var(--muted); }
    .step pre { white-space: pre-wrap; max-height: 16rem; overflow: auto; background: #070c16; padding: .4rem; border-radius: .3rem; font-size: .72rem; margin: .3rem 0 0; }
    .thinking { color: var(--muted); font-size: .8rem; }
    .composer { border-top: 1px solid var(--line); padding: .6rem .8rem; display: flex; flex-direction: column; gap: .4rem; }
    .composer textarea, .assistant input[type=password], .assistant input[type=text] { width: 100%; background: #0b1220; color: white; border: 1px solid #69809a; border-radius: .35rem; padding: .45rem; }
    button.primary { background: #2f5d8f; border-color: #8fb8e6; }
    button.danger { background: #5c2626; border-color: #b05a5a; }
    @media (max-width: 900px) { body.with-assistant { padding-right: 0; } }
  </style>
</head>
<body>
  <header>
    <div><h1>Splunk Lab Observer</h1><div class="subtitle" id="summary">Loading the lab…</div></div>
    <div class="row">
      <button id="assistant-toggle" type="button" title="Ask Claude about the lab and watch it work here">Ask Claude</button>
      <button id="discover" type="button" title="Discover components and relationships now">Discover now</button>
      <button id="capture" type="button" title="Take new screen previews of every Splunk Web">Capture previews</button>
      <form id="logout" method="post" action="/observer/logout" hidden><button type="submit">Sign out</button></form>
    </div>
  </header>
  <nav role="tablist">
    <button role="tab" data-tab="wall" aria-selected="true">Wall</button>
    <button role="tab" data-tab="overview" aria-selected="false">Overview</button>
    <button role="tab" data-tab="changes" aria-selected="false">Changes</button>
  </nav>
  <main id="main"></main>
  <script>
  'use strict';
  const DESKTOP = {width: 1440, height: 900};
  const MAX_LIVE = 4;
  let lab = null;
  let tab = 'wall';
  let layout = {tiles: [], columns: 3};
  let savedLayout = null;
  let pickerOpen = false;
  let focused = null;
  let drawer = null;
  let history = null;  // {time, data}: the wall replays recorded state at one moment

  function h(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value === false || value === null || value === undefined) continue;
      if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else if (key === 'class') node.className = value;
      else if (key === 'style') node.setAttribute('style', value);
      else node.setAttribute(key, value === true ? '' : value);
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }
  function when(iso) {
    if (!iso) return 'never';
    const seconds = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
    if (seconds < 60) return `${Math.max(seconds, 0)}s ago`;
    if (seconds < 3600) return `${Math.round(seconds / 60)} min ago`;
    if (seconds < 86400) return `${Math.round(seconds / 3600)} h ago`;
    return new Date(iso).toLocaleString();
  }
  function stamp(iso) { return h('time', {datetime: iso, title: iso ? new Date(iso).toLocaleString() : ''}, when(iso)); }
  async function api(path, options) {
    const response = await fetch(path, Object.assign({cache: 'no-store'}, options));
    if (response.status === 401) { window.location.assign('/observer/login'); throw new Error('login required'); }
    if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
    return response.json();
  }
  function post(path, body) {
    return api(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
  }
  const byId = id => lab && lab.components.find(item => item.id === id);
  const displayName = component => component.owner_name || component.id;
  const isWeb = component => Boolean(component.web_path);

  function stateBadge(component) {
    const status = component.status || {};
    const container = status.container && status.container.value;
    if (component.historical && !container) return h('span', {class: 'badge', title: 'Nothing recorded at or before this time'}, 'no record');
    const state = container ? container.state : (component.facts.container_state || {}).value;
    if (state !== 'running') return h('span', {class: 'badge bad', title: 'Container state from podman ps'}, state || 'unknown');
    const health = status.splunk_health && status.splunk_health.value.health;
    if (health) {
      const tone = {green: 'ok', yellow: 'warn', red: 'bad'}[health] || '';
      return h('span', {class: `badge ${tone}`, title: `Splunk health ${health}, ${status.splunk_health.source}`}, `health ${health}`);
    }
    const docker = container && container.health;
    return h('span', {class: `badge ${docker === 'unhealthy' ? 'bad' : 'ok'}`, title: 'Container state from podman ps'}, docker ? `running, ${docker}` : 'running');
  }
  // A plain-English description built from discovered roles, clusters, and relationships.
  function siteOf(component) {
    const group = lab.groups.find(item => item.members.includes(component.id) && item.label);
    if (group) return group.label;
    const token = component.id.split('-')[1];
    return token && !['fwd', 'lab', 'observer'].includes(token) ? token : null;
  }
  function siteName(site) {
    if (!site) return '';
    if (site === 'mgmt') return 'Management';
    return site.length <= 3 ? site.toUpperCase() : site[0].toUpperCase() + site.slice(1);
  }
  function describeTargets(ids) {
    const group = ids.length > 1 && lab.groups.find(item => ids.every(id => item.members.includes(id)));
    if (group) return groupName(group);
    return ids.map(id => byId(id) ? plainName(byId(id), true) : id).join(', ');
  }
  function groupName(group) {
    return `${siteName(group.label)} ${group.type === 'indexer_cluster' ? 'indexer cluster' : 'search head cluster'}`.trim();
  }
  function plainName(component, short) {
    const roles = new Set((component.facts.server_roles || {}).value || []);
    const site = siteName(siteOf(component));
    const number = (component.id.match(/(\d+)$/) || [])[1];
    const at = site ? `${site} ` : '';
    const outgoing = type => lab.relationships.filter(rel => rel.from === component.id && rel.type === type).map(rel => rel.to);
    const incoming = type => lab.relationships.filter(rel => rel.to === component.id && rel.type === type);
    const image = (component.facts.image || {}).value || '';
    const version = (image.split(':')[1] || '');
    const federated = incoming('federated search provider').length ? ' (federated search provider for HQ)' : '';
    let name;
    if (component.kind === 'splunk_enterprise') {
      if (roles.has('cluster_manager')) name = `${at}indexer cluster manager`;
      else if (roles.has('shc_deployer')) name = `${at}search head cluster deployer`;
      else if (roles.has('shc_member') || roles.has('shc_captain')) name = `${at}search head${number ? ` ${number}` : ''}${roles.has('shc_captain') && !short ? ' (cluster captain)' : ''}`;
      else if (roles.has('cluster_peer')) name = `${at}indexer${number ? ` ${number}` : ''}`;
      else if (roles.has('heavyweight_forwarder')) name = `Heavy forwarder, Splunk ${(component.facts.splunk_version || {}).value || version}`;
      else if (roles.has('indexer') && roles.has('search_head')) name = `${at}standalone search head and indexer`;
      else if (roles.has('indexer')) name = `${at}standalone indexer${short ? '' : federated}`;
      else if (roles.has('search_head')) name = `${at}standalone search head`;
      else name = `${at}Splunk Enterprise instance`;
      if (roles.has('heavyweight_forwarder') && !short) {
        const targets = outgoing('sends data to');
        if (targets.length) name += `, sends to ${describeTargets(targets)}`;
      }
    } else if (component.kind === 'universal_forwarder') {
      name = `${at}universal forwarder${version ? ` ${version}` : ''}`;
      const targets = outgoing('sends data to');
      const managers = outgoing('discovers indexers through');
      const cluster = managers.length && lab.groups.find(group => group.manager === managers[0]);
      if (targets.length && !short) name += `, sends to ${describeTargets(targets)}`;
      else if (cluster && !short) name += `, sends to ${groupName(cluster)} (found through its manager)`;
    } else if (component.kind === 'load_balancer') {
      const targets = outgoing('load balances');
      name = targets.length ? `Load balancer for the ${describeTargets(targets)}` : `${at}load balancer`;
      if (!short && incoming('federated search provider').length) name += ' (HQ federated search entry point)';
    } else if (component.kind === 'data_generator') name = `${at}test data generator`;
    else if (component.kind === 'observer_router') name = 'Observer router (connects this page to Splunk)';
    else name = `${component.id.replace(/^p-/, '').split('-').join(' ')} container`;
    return name[0].toUpperCase() + name.slice(1);
  }
  function kindLabel(kind) {
    return {splunk_enterprise: 'Splunk Enterprise', universal_forwarder: 'Universal forwarder', load_balancer: 'Load balancer',
      data_generator: 'Data generator', observer_router: 'Observer router', container: 'Container'}[kind] || kind;
  }
  function rolesOf(component) {
    const roles = (component.facts.server_roles || {}).value || [];
    // Old aliases (cluster_master, cluster_slave, license_master) repeat the current names; every
    // lab instance carries kv_store and license_manager, so they say nothing about its role.
    const interesting = roles.filter(role => !['kv_store', 'license_collector', 'license_master', 'license_manager',
      'cluster_master', 'cluster_slave', 'search_peer'].includes(role));
    return interesting.length ? interesting.join(', ') : '';
  }

  // --- data -------------------------------------------------------------------------
  async function refresh() {
    try {
      lab = await api('/observer/api/lab');
      document.getElementById('logout').hidden = !lab.login_required;
      if (!layout.tiles.length && !savedLayout) defaultLayout();
      document.getElementById('summary').textContent =
        `${lab.components.length} components, ${lab.components.filter(isWeb).length} with Splunk Web · discovery ${when(lab.checked_at)}` +
        (lab.monitor && lab.monitor.health_at ? ` · health ${when(lab.monitor.health_at)}` : '') +
        (lab.capture && lab.capture.running ? ' · capturing previews…' : '');
      render();
    } catch (error) {
      document.getElementById('summary').textContent = `Observer unavailable: ${error.message}`;
    }
  }
  // Every Splunk Web, as previews (cheap images) with the first one live, grouped by cluster.
  function allWebTiles() {
    const ordered = groupsForPicker().flatMap(([, members]) => members).filter(id => isWeb(byId(id)));
    return [...new Set(ordered)].map((id, index) => ({id, live: index === 0}));
  }
  function defaultLayout() {
    layout = {tiles: allWebTiles(), columns: 4};
  }
  async function loadLayout() {
    try {
      const result = await api('/observer/api/layout');
      if (result.layout && Array.isArray(result.layout.tiles)) {
        savedLayout = result.layout;
        layout = {tiles: result.layout.tiles.map(tile => ({id: tile.id, live: Boolean(tile.live)})), columns: result.layout.columns || 3};
      }
    } catch (_error) { /* first run: no saved layout */ }
  }
  const layoutDirty = () => !savedLayout || JSON.stringify({tiles: layout.tiles, columns: layout.columns}) !==
    JSON.stringify({tiles: savedLayout.tiles.map(tile => ({id: tile.id, live: Boolean(tile.live)})), columns: savedLayout.columns || 3});

  // --- rendering ----------------------------------------------------------------------
  // The wall stays in the page while other tabs show, and its tiles are never moved in the
  // document: moving an iframe reloads it, so order comes from CSS and only headers,
  // previews, and footers are rebuilt on refresh.
  const panes = {wall: h('div', {}), overview: h('div', {hidden: true}), changes: h('div', {hidden: true})};
  const wallTop = h('div', {});
  const grid = h('div', {class: 'wall'});
  const tileNodes = new Map();  // component id -> {node, live}
  panes.wall.append(wallTop, grid);
  document.getElementById('main').append(panes.wall, panes.overview, panes.changes);

  function render() {
    for (const button of document.querySelectorAll('nav button')) button.setAttribute('aria-selected', String(button.dataset.tab === tab));
    for (const [name, pane] of Object.entries(panes)) pane.hidden = name !== tab;
    renderWall();
    if (tab === 'overview') panes.overview.replaceChildren(renderOverview());
    if (tab === 'changes') panes.changes.replaceChildren(renderChanges());
    renderFocus();
    renderDrawer();
    requestAnimationFrame(layoutFrames);
  }

  function renderWall() {
    const live = layout.tiles.filter(tile => tile.live).length;
    const wrapper = h('div', {});
    wrapper.append(h('div', {class: 'toolbar'},
      h('button', {type: 'button', 'aria-pressed': String(pickerOpen), onclick: () => { pickerOpen = !pickerOpen; render(); }}, `Choose views (${layout.tiles.length})`),
      h('label', {class: 'row muted'}, 'Columns',
        h('select', {onchange: event => { layout.columns = Number(event.target.value); render(); }},
          [1, 2, 3, 4].map(n => h('option', {value: n, selected: layout.columns === n}, n)))),
      h('button', {type: 'button', title: 'Show every Splunk Web as a preview', onclick: () => {
        const live = new Set(layout.tiles.filter(tile => tile.live).map(tile => tile.id));
        const tiles = allWebTiles().map(tile => ({id: tile.id, live: live.has(tile.id)}));
        const extra = layout.tiles.filter(tile => !tiles.some(item => item.id === tile.id));
        layout.tiles = tiles.concat(extra); render(); }}, `Show all Splunk screens (${lab.components.filter(isWeb).length})`),
      h('button', {type: 'button', onclick: saveLayout}, layoutDirty() ? 'Save layout' : 'Layout saved'),
      savedLayout ? h('button', {type: 'button', onclick: async () => { await loadLayout(); render(); }, disabled: !layoutDirty()}, 'Restore saved') : null,
      h('span', {class: 'muted'}, savedLayout ? ['Saved ', stamp(savedLayout.saved_at)] : 'Not saved yet'),
    ));
    wrapper.append(renderTimebar());
    if (history) {
      const changes = history.data.changes;
      wrapper.append(h('div', {class: 'history-note'},
        h('strong', {}, `Showing the lab as recorded at ${new Date(history.time).toLocaleString()}. `),
        'Live views are paused; each tile shows its newest preview at or before that moment and how far before it was taken. ',
        `A preview more than ${Math.round(history.data.missing_capture_after_seconds / 60)} minutes old, or whose file has expired, is marked missing.`,
        h('details', {}, h('summary', {}, `${changes.length} change(s) within 30 minutes of this time`), changesTable(changes, true))));
    }
    if (live > MAX_LIVE && !history) wrapper.append(h('div', {class: 'notice'}, `${live} live views are open. Each is a full Splunk page in your browser; more than ${MAX_LIVE} may slow it down. Switch some to previews.`));
    if (pickerOpen) wrapper.append(renderPicker());
    if (!layout.tiles.length) wrapper.append(h('p', {class: 'muted'}, 'No views selected. Use “Choose views” to add components.'));
    wallTop.replaceChildren(wrapper);
    grid.style.setProperty('--columns', layout.columns);
    const wanted = new Set();
    layout.tiles.forEach((tile, index) => {
      const component = byId(tile.id);
      if (!component) return;
      wanted.add(tile.id);
      const view = history ? historical(component) : component;
      const live = !history && tile.live && focused !== tile.id && isWeb(component);
      let entry = tileNodes.get(tile.id);
      if (entry && entry.live !== live) { entry.node.remove(); entry = null; }
      if (!entry) {
        entry = {node: h('article', {class: 'tile', draggable: 'true', 'data-id': tile.id}), live, body: null};
        wireDrag(entry.node);
        tileNodes.set(tile.id, entry);
        grid.append(entry.node);
      }
      entry.node.style.order = index;
      updateTile(entry, view, tile, index);
    });
    for (const [id, entry] of tileNodes) if (!wanted.has(id)) { entry.node.remove(); tileNodes.delete(id); }
  }

  function historical(component) {
    return Object.assign({}, component, {historical: true, status: history.data.components[component.id] || {}});
  }
  function localInput(date) {
    const pad = n => String(n).padStart(2, '0');

  }
  async function setHistory(date) {
    if (!date) { history = null; render(); return; }
    const now = Date.now();
    const clamped = new Date(Math.min(date.getTime(), now));
    const data = await api(`/observer/api/at?time=${encodeURIComponent(clamped.toISOString())}`);
    history = {time: data.time, data};
    focused = null;
    render();
  }
  function renderTimebar() {
    const start = lab.history_from ? Date.parse(lab.history_from) : Date.now() - 3600000;
    const end = Date.now();
    const current = history ? Date.parse(history.time) : end;
    const step = minutes => setHistory(new Date(current + minutes * 60000));
    return h('div', {class: 'toolbar timebar'},
      h('span', {class: 'muted'}, 'Time'),
      h('button', {type: 'button', 'aria-pressed': String(!history), onclick: () => setHistory(null)}, 'Now (live)'),
      h('button', {type: 'button', title: '10 minutes earlier', onclick: () => step(-10)}, '−10 min'),

  }

  function groupsForPicker() {
    const sections = [];
    const seen = new Set();
    for (const group of lab.groups) {
      const members = group.members.filter(byId);
      members.forEach(id => seen.add(id));
      sections.push([groupName(group), members]);
    }
    const rest = lab.components.filter(item => !seen.has(item.id));
    for (const kind of ['splunk_enterprise', 'universal_forwarder', 'load_balancer', 'data_generator', 'observer_router', 'container']) {
      const members = rest.filter(item => item.kind === kind).map(item => item.id);
      if (members.length) sections.push([{splunk_enterprise: 'Other Splunk servers', universal_forwarder: 'Universal forwarders',
        load_balancer: 'Load balancers', data_generator: 'Test data generators', observer_router: 'Observer', container: 'Other containers'}[kind], members]);
    }

  }
  function renderPicker() {
    return h('div', {class: 'picker'}, groupsForPicker().map(([title, members]) => h('section', {},
      h('h3', {}, title),
      members.map(id => {
        const component = byId(id);
        const tile = layout.tiles.find(item => item.id === id);
        return h('label', {},
          h('input', {type: 'checkbox', checked: Boolean(tile), onchange: event => {
            if (event.target.checked) layout.tiles.push({id, live: false}); else layout.tiles = layout.tiles.filter(item => item.id !== id);
            render(); }}),
          h('span', {class: 'pick-name'}, component.owner_name || plainName(component),
            h('span', {class: 'muted pick-host'}, component.id, isWeb(component) ? '' : ' · console')), stateBadge(component));
      }))));
  }

  function wireDrag(node) {
    const indexOf = () => layout.tiles.findIndex(tile => tile.id === node.dataset.id);
    node.addEventListener('dragstart', event => { event.dataTransfer.setData('text/plain', node.dataset.id); node.classList.add('dragging'); });
    node.addEventListener('dragend', () => node.classList.remove('dragging'));
    node.addEventListener('dragover', event => { event.preventDefault(); node.classList.add('drop-target'); });
    node.addEventListener('dragleave', () => node.classList.remove('drop-target'));
    node.addEventListener('drop', event => {
      event.preventDefault(); node.classList.remove('drop-target');
      move(layout.tiles.findIndex(tile => tile.id === event.dataTransfer.getData('text/plain')), indexOf());
    });
  }

  function updateTile(entry, component, tile, index) {
    const head = h('div', {class: 'tile-head'},
      h('span', {class: 'name', title: component.id}, displayName(component)), stateBadge(component), h('span', {class: 'spacer'}),
      isWeb(component) ? h('button', {class: 'small', type: 'button', 'aria-pressed': String(tile.live), disabled: Boolean(history),
        title: history ? 'Return to Now to use live views' : 'Live view or timestamped preview',
        onclick: () => { tile.live = !tile.live; render(); }}, tile.live ? 'Live' : 'Preview') : null,
      h('button', {class: 'small', type: 'button', title: isWeb(component) ? 'Focus this view and its screen list' : 'Focus this view', onclick: () => { focused = component.id; render(); }}, '⤢'),
      h('button', {class: 'small', type: 'button', title: 'Details and history', onclick: () => openDrawer(component.id)}, 'ⓘ'),
      h('button', {class: 'small', type: 'button', title: 'Move earlier', disabled: index === 0, onclick: () => move(index, index - 1)}, '◀'),
      h('button', {class: 'small', type: 'button', title: 'Move later', disabled: index === layout.tiles.length - 1, onclick: () => move(index, index + 1)}, '▶'),
      h('button', {class: 'small', type: 'button', title: 'Remove from wall', onclick: () => { layout.tiles.splice(index, 1); render(); }}, '✕'));
    const [body, foot] = entry.live && entry.body ? [entry.body, liveFoot(component)] : tileContent(component, entry.live);
    entry.body = body;
    if (entry.node.firstChild) {
      entry.node.replaceChild(head, entry.node.children[0]);
      if (entry.node.children[1] !== body) entry.node.replaceChild(body, entry.node.children[1]);
      entry.node.replaceChild(foot, entry.node.children[2]);
    } else {
      entry.node.append(head, body, foot);
    }
  }
  const liveFoot = component => h('div', {class: 'tile-foot'}, `Live · ${component.web_path} · sign in with your own lab account`);

  function tileContent(component, live) {
    const body = h('div', {class: 'tile-body'});
    let foot;
    if (component.historical) {
      const status = component.status;
      const container = status.container;
      if (!isWeb(component)) {
        body.append(h('div', {class: 'empty'}, 'Console output is not recorded. ',
          container ? `Container ${container.value.state}${container.value.health ? `, ${container.value.health}` : ''}, as recorded ${new Date(container.observed_at).toLocaleString()}.` : 'No container state recorded by then.'));
        return [body, h('div', {class: 'tile-foot'}, container ? container.source : 'No record')];
      }
      const gap = status.capture_at_time || {};
      const missing = gap.missing ? h('span', {class: 'badge bad'}, 'missing capture') : null;
      if (status.preview && gap.file_available) {
        body.append(h('img', {src: `/observer/captures/${status.preview.value.file}`, alt: `Preview of ${displayName(component)}`, loading: 'lazy'}));
        foot = h('div', {class: 'tile-foot'}, `Captured ${new Date(status.preview.observed_at).toLocaleTimeString()}, ${Math.round(gap.gap_seconds / 60)} min before the selected time `, missing);
      } else {
        body.append(h('div', {class: 'empty'}, status.preview ? 'The preview from that time has expired (previews are kept for 48 hours).' : 'No preview was captured at or before this time.'));
        foot = h('div', {class: 'tile-foot'}, missing || 'No capture');
      }
      return [body, foot];
    }
    if (!isWeb(component)) {
      const consoleNode = h('div', {class: 'console'}, 'Loading console…');
      body.append(consoleNode);
      foot = h('div', {class: 'tile-foot'}, 'Console: podman logs and stats');
      loadConsole(component.id, consoleNode, foot);
    } else if (live) {
      body.append(h('iframe', {src: `${component.web_path}en-US/app/launcher/home`, title: `Live Splunk Web of ${displayName(component)}`}));
      foot = liveFoot(component);
    } else {
      const preview = (component.status || {}).preview;
      const failed = (component.status || {}).capture;
      if (preview) {
        body.append(h('img', {src: `/observer/captures/${preview.value.file}`, alt: `Preview of ${displayName(component)}`, loading: 'lazy'}));
        foot = h('div', {class: 'tile-foot'}, 'Preview captured ', stamp(preview.observed_at), ` · ${preview.value.page || ''}`,
          failed && failed.value.error ? h('span', {class: 'badge bad'}, ' last capture failed') : '');
      } else {
        body.append(h('div', {class: 'empty'}, failed && failed.value.error ? `Preview failed: ${failed.value.error}` : 'No preview captured yet. Switch to Live, or use “Capture previews”.'));
        foot = h('div', {class: 'tile-foot'}, 'Preview');
      }
    }
    return [body, foot];
  }

  function layoutFrames() {
    for (const frame of document.querySelectorAll('.tile-body iframe')) {
      const box = frame.parentElement.getBoundingClientRect();
      if (!box.width) continue;
      const scale = Math.min(1, box.width / DESKTOP.width);
      frame.style.width = `${Math.max(DESKTOP.width, box.width)}px`;
      frame.style.height = `${box.height / scale}px`;
      frame.style.transform = scale < 1 ? `scale(${scale})` : '';
    }
  }
  window.addEventListener('resize', layoutFrames);
  new ResizeObserver(layoutFrames).observe(grid);

  async function loadConsole(id, node, foot) {
    try {
      const result = await api(`/observer/api/components/${encodeURIComponent(id)}/console`);
      const resources = result.resources ? result.resources.value : null;
      node.textContent = (resources ? `CPU ${resources.cpu_percent || '?'} · memory ${resources.memory || '?'}\n\n` : '') + (result.log || '(no output)');
      node.scrollTop = node.scrollHeight;
      foot.replaceChildren(`${result.source} · checked `, stamp(result.checked_at));
    } catch (error) { node.textContent = `Console unavailable: ${error.message}`; }
  }

  function move(from, to) {
    if (to < 0 || to >= layout.tiles.length || from === to) return;
    const [tile] = layout.tiles.splice(from, 1);
    layout.tiles.splice(to, 0, tile);
    render();
  }
  async function saveLayout() {
    const result = await post('/observer/api/layout', {layout: {tiles: layout.tiles, columns: layout.columns}});
    savedLayout = result.layout;
    render();
  }

    if (isWeb(component) && !history) main.append(screenList(component, body.querySelector('iframe')));

        h('button', {type: 'button', onclick: () => openDrawer(component.id)}, 'Details'),
        h('button', {type: 'button', onclick: () => { focused = null; render(); }}, 'Close (Esc)')),
      main));

  function screenList(component, frame) {
    const panel = h('div', {class: 'screens', 'aria-label': 'Screens'}, h('p', {class: 'muted'}, 'Loading screens…'));
    api(`/observer/api/components/${encodeURIComponent(component.id)}/screens`).then(result => {
      const filter = h('input', {type: 'search', placeholder: `Filter ${result.screens.length} screens`, 'aria-label': 'Filter screens'});
      const list = h('div', {});
      const base = component.web_path.replace(/\/$/, '');
      const draw = () => {
        const term = filter.value.trim().toLowerCase();
        const groups = new Map();
        for (const screen of result.screens) {
          const text = `${screen.app_label} ${screen.group || ''} ${screen.label}`.toLowerCase();
          if (term && !text.includes(term)) continue;
          const key = `${screen.app_label}${screen.app_version ? ` ${screen.app_version}` : ''}`;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(screen);
        }
        list.replaceChildren(...[...groups].map(([title, screens]) => h('section', {}, h('h4', {}, title),
          screens.map(screen => h('button', {class: 'screen', type: 'button', title: `${screen.path} · ${screen.source}`,
            'aria-current': String(frame.dataset.screen === screen.path),
            onclick: () => { frame.dataset.screen = screen.path; frame.src = base + screen.path; draw(); }},
            screen.group ? `${screen.group} › ${screen.label}` : screen.label)))));

  // --- details drawer ----------------------------------------------------------------
  async function openDrawer(id) {
    drawer = {id, data: null};
    render();
    try { drawer.data = await api(`/observer/api/components/${encodeURIComponent(id)}`); } catch (error) { drawer.error = error.message; }

  function renderDrawer() {
    document.querySelector('.drawer')?.remove();
    if (!drawer) return;
    const panel = h('aside', {class: 'drawer', 'aria-label': 'Component details'});
    panel.append(h('div', {class: 'row'}, h('h2', {style: 'margin:0;flex:1'}, drawer.data ? displayName(drawer.data.component) : drawer.id),
      h('button', {type: 'button', onclick: () => { drawer = null; render(); }}, 'Close')));
    if (drawer.error) panel.append(h('p', {class: 'notice'}, drawer.error));
    if (!drawer.data) { panel.append(h('p', {class: 'muted'}, 'Loading…')); document.body.append(panel); return; }
    const {component, latest, changes} = drawer.data;
    const nameInput = h('input', {value: component.owner_name || '', placeholder: component.id, maxlength: 80});
    const descriptionInput = h('textarea', {rows: 2, maxlength: 500, placeholder: 'What this component is for'}, component.owner_description || '');
    panel.append(h('h3', {}, 'Your label'),

      h('div', {class: 'row', style: 'margin-top:.5rem'},
        h('button', {type: 'button', onclick: async () => { await post(`/observer/api/components/${encodeURIComponent(component.id)}/label`, {name: nameInput.value, description: descriptionInput.value}); await refresh(); openDrawer(component.id); }}, 'Save label'),
        h('button', {type: 'button', onclick: async () => { await post(`/observer/api/components/${encodeURIComponent(component.id)}/label`, {name: '', description: ''}); await refresh(); openDrawer(component.id); }}, 'Clear'),
        component.owner_edited_at ? h('span', {class: 'muted'}, 'Edited ', stamp(component.owner_edited_at)) : null));
    panel.append(h('h3', {}, 'Discovered facts'), h('table', {}, h('tbody', {}, Object.entries(component.facts).map(([key, item]) => h('tr', {},
      h('th', {}, key), h('td', {}, Array.isArray(item.value) ? item.value.join(', ') : String(item.value ?? '—'),
        h('div', {class: 'fact-source'}, item.source, ' · ', stamp(item.checked_at))))))));
    panel.append(h('h3', {}, 'Latest observations'), h('table', {}, h('tbody', {}, Object.entries(latest).filter(([, item]) => item).map(([kind, item]) => h('tr', {},
      h('th', {}, kind), h('td', {}, summarize(kind, item.value), h('div', {class: 'fact-source'}, item.source, ' · ', stamp(item.observed_at), ' · ',
        h('a', {href: `/observer/api/observations/${item.id}`, target: '_blank', rel: 'noopener'}, `observation #${item.id}`))))))));
    if (latest.splunk_messages && latest.splunk_messages.value.messages && latest.splunk_messages.value.messages.length) {
      panel.append(h('h3', {}, 'splunkd messages'), h('pre', {}, latest.splunk_messages.value.messages.map(item => `[${item.severity}] ${item.message}`).join('\n')));
    }
    panel.append(h('h3', {}, 'History'), changesTable(changes, false));
    document.body.append(panel);
  }
  function summarize(kind, value) {
    if (value.error) return `error: ${value.error}`;
    if (kind === 'container') return `${value.state}${value.health ? `, ${value.health}` : ''} (${value.status || ''})`;
    if (kind === 'resources') return `CPU ${value.cpu_percent ?? '?'} · memory ${value.memory ?? '?'}`;
    if (kind === 'web') return value.http_status ? `HTTP ${value.http_status}` : 'unreachable';
    if (kind === 'splunk_health') {
      const degraded = Object.entries(value.degraded_features || {});
      return `${value.health}${degraded.length ? ` — ${degraded.map(([feature, color]) => `${feature}: ${color}`).join(', ')}` : ''}`;
    }
    if (kind === 'splunk_messages') return `${value.count} message(s)`;
    if (kind === 'capture') return value.file ? `screenshot of ${value.page || 'page'}` : 'capture failed';
    return JSON.stringify(value);
  }

  // --- assistant ---------------------------------------------------------------------
  // Claude works on the server; this panel shows each step as it happens. A show_screen step
  // opens that component's view here, and a change waits for an approval card below.
  const assistant = {open: false, status: null, runs: [], run: null, events: new Map(), rev: 0, timer: null, shown: new Set(), error: null, busy: false};
  const assistantNode = h('aside', {class: 'assistant', 'aria-label': 'Claude assistant', hidden: true});
  const assistantHead = h('div', {class: 'assistant-head'});
  const trail = h('div', {class: 'trail', 'aria-live': 'polite'});
  const composer = h('div', {class: 'composer'});
  const promptInput = h('textarea', {rows: 3, placeholder: 'Ask about the lab, or ask Claude to do something in it…', 'aria-label': 'Prompt for Claude'});
  promptInput.addEventListener('keydown', event => { if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) { event.preventDefault(); sendPrompt(); } });
  assistantNode.append(assistantHead, trail, composer);
  document.body.append(assistantNode);
  // A live run is still adding steps; only an in-page run occupies the prompt (a terminal session runs beside it).
  const liveRun = () => assistant.run && ['running', 'waiting_for_approval'].includes(assistant.run.status);
  const terminalRun = () => assistant.run && assistant.run.origin === 'terminal';
  const activeRun = () => liveRun() && !terminalRun();
  const pageOpenedAt = Date.now();
  const followed = new Set();

  function setAssistantOpen(open) {
    assistant.open = open;
    assistantNode.hidden = !open;
    document.body.classList.toggle('with-assistant', open);
    document.getElementById('assistant-toggle').setAttribute('aria-pressed', String(open));
    try { localStorage.setItem('assistant-open', open ? '1' : ''); } catch (_error) { /* storage unavailable */ }
    if (open) loadAssistant();
    requestAnimationFrame(layoutFrames);
  }
  async function loadAssistant() {
    try {
      const result = await api('/observer/api/assistant');
      assistant.status = result.status;
      assistant.runs = result.runs;
      assistant.error = null;
      if (!assistant.run && result.runs.length) await selectRun(result.runs[0].id);
    } catch (error) { assistant.error = error.message; }
    renderAssistant();
  }
  async function selectRun(id, follow) {
    clearTimeout(assistant.timer);
    assistant.run = null; assistant.events = new Map(); assistant.rev = 0; assistant.shown = new Set();
    if (id) await fetchRun(id, !follow);
    renderAssistant();
  }
  // Follow a run started elsewhere (Claude Code in the terminal, or another browser) while it is live.
  async function followLive() {
    try {
      const {latest} = await api('/observer/api/assistant/live');
      if (!latest || latest.status !== 'running' || followed.has(latest.id) || activeRun()) return;
      if (assistant.run && assistant.run.id === latest.id) return;
      if (Date.parse(latest.updated_at) < pageOpenedAt - 60000) return;
      followed.add(latest.id);
      if (!assistant.open) setAssistantOpen(true);
      await selectRun(latest.id, true);
      loadAssistantRuns();
    } catch (_error) { /* next poll */ }
  }
  setInterval(followLive, 2500);
  async function fetchRun(id, initial) {
    clearTimeout(assistant.timer);
    let result;
    try { result = await api(`/observer/api/assistant/runs/${encodeURIComponent(id)}?since=${assistant.rev}`); }
    catch (error) { assistant.error = error.message; renderAssistant(); assistant.timer = setTimeout(() => fetchRun(id), 3000); return; }
    if (assistant.run && assistant.run.id !== id) return;  // another run was selected meanwhile
    for (const item of result.events) {
      const previous = assistant.events.get(item.seq);
      assistant.events.set(item.seq, item);
      assistant.rev = Math.max(assistant.rev, item.rev);
      if (item.type === 'display' && !assistant.shown.has(item.seq)) {
        assistant.shown.add(item.seq);
        if (!initial) showScreen(item.component, item.path);
      }
      if (item.type === 'tool' && item.name === 'container_action' && item.status === 'ok' && previous && previous.status !== 'ok') {
        refresh(); setTimeout(refresh, 20000); setTimeout(refresh, 70000);
      }
      if (item.type === 'approval' && item.decision === 'pending' && !assistant.open) setAssistantOpen(true);
    }
    const wasActive = liveRun();
    assistant.run = Object.assign({}, result, {events: undefined});
    renderAssistant();
    if (liveRun()) assistant.timer = setTimeout(() => fetchRun(id), 1000);
    else if (wasActive) { refresh(); loadAssistant(); }
  }
  function showScreen(component, path) {
    if (!byId(component)) return;
    if (history) history = null;
    tab = 'wall';
    focused = component;
    render();
    const frame = document.querySelector('.focus iframe');
    if (frame && path) {
      frame.dataset.screen = path;
      frame.src = byId(component).web_path.replace(/\/$/, '') + path;
    }
  }
  async function sendPrompt() {
    const text = promptInput.value.trim();
    if (!text || assistant.busy) return;
    assistant.busy = true; assistant.error = null; renderAssistant();
    try {
      const continuing = assistant.run && !activeRun() && !terminalRun();
      const result = continuing
        ? await postWithReason(`/observer/api/assistant/runs/${encodeURIComponent(assistant.run.id)}/messages`, {prompt: text})
        : await postWithReason('/observer/api/assistant/runs', {prompt: text});
      promptInput.value = '';
      if (!continuing) { assistant.events = new Map(); assistant.rev = 0; assistant.shown = new Set(); followed.add(result.id); }
      assistant.run = Object.assign({}, result, {events: undefined});
      await fetchRun(result.id);
      loadAssistantRuns();
    } catch (error) {
      assistant.error = await errorText(error);
    } finally { assistant.busy = false; renderAssistant(); }
  }
  async function loadAssistantRuns() {
    try { assistant.runs = (await api('/observer/api/assistant')).runs; renderAssistant(); } catch (_error) { /* next poll */ }
  }
  // POST helpers throw on non-2xx; read the server's reason when it gave one.
  async function errorText(error) { return error.reason || error.message; }
  async function postWithReason(path, body) {
    const response = await fetch(path, {method: 'POST', cache: 'no-store', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    const value = await response.json().catch(() => ({}));
    if (!response.ok) { const error = new Error(value.error || `HTTP ${response.status}`); error.reason = value.error; throw error; }
    return value;
  }
  async function decide(approvalId, decision, note) {
    try { await postWithReason(`/observer/api/assistant/runs/${encodeURIComponent(assistant.run.id)}/approvals/${approvalId}`, {decision, note}); }
    catch (error) { assistant.error = await errorText(error); }
    fetchRun(assistant.run.id);
  }
  async function saveKey(value) {
    try { assistant.status = (await postWithReason('/observer/api/assistant/key', {api_key: value})).status; assistant.error = null; }
    catch (error) { assistant.error = await errorText(error); }
    renderAssistant();
  }

  function richText(text) {
    // Bold and inline code only; everything else stays plain text.
    return text.split(/(\*\*[^*\n]+\*\*|`[^`\n]+`)/).map(part =>
      part.startsWith('**') && part.endsWith('**') && part.length > 4 ? h('strong', {}, part.slice(2, -2)) :
      part.startsWith('`') && part.endsWith('`') && part.length > 2 ? h('code', {}, part.slice(1, -1)) : part);
  }
  function toolSummary(item) {
    const input = item.input || {};
    return Object.entries(input).filter(([key, value]) => value !== '' && !['reason', 'expected_effect', 'cleanup'].includes(key))
      .map(([key, value]) => `${key}=${typeof value === 'string' ? value : JSON.stringify(value)}`).join(' · ');
  }
  function stepNode(item) {
    const time = h('span', {class: 'muted', style: 'font-size:.72rem'}, new Date(item.at).toLocaleTimeString());
    switch (item.type) {
      case 'prompt': return h('div', {class: 'step you'}, item.text);
      case 'text': return h('div', {class: 'step claude'}, richText(item.text));
      case 'thinking': return h('details', {class: 'thinking'}, h('summary', {}, 'Claude’s reasoning (summary)'), h('div', {style: 'white-space:pre-wrap'}, item.text));
      case 'tool': {
        const tone = {ok: 'ok', error: 'bad', running: 'warn'}[item.status] || '';
        return h('div', {class: 'step tool'},
          h('div', {class: 'row'}, h('strong', {}, item.name), h('span', {class: `badge ${tone}`}, item.status === 'running' ? 'running…' : item.status), time,
            item.seconds !== undefined ? h('span', {class: 'muted', style: 'font-size:.72rem'}, `${item.seconds}s`) : null),
          toolSummary(item) ? h('div', {class: 'muted', style: 'overflow-wrap:anywhere'}, toolSummary(item)) : null,
          h('div', {class: 'fact-source'}, item.source),
          item.result !== undefined && item.result !== null ? h('details', {}, h('summary', {}, item.name === 'Claude Code' ? 'Result' : item.status === 'error' ? 'Error sent to Claude' : 'Evidence sent to Claude'), h('pre', {}, item.result)) : null);
      }
      case 'display': {
        const component = byId(item.component);
        return h('div', {class: 'step display'}, h('div', {class: 'row'}, '👁 Showing ', h('strong', {}, component ? displayName(component) : item.component), time,
          h('button', {class: 'small', type: 'button', onclick: () => showScreen(item.component, item.path)}, 'Show again')),
          item.path ? h('div', {class: 'muted', style: 'overflow-wrap:anywhere'}, item.path) : null);
      }
      case 'approval': {
        const details = item.details || {};
        const note = h('input', {type: 'text', placeholder: 'Optional note to Claude', 'aria-label': 'Note to Claude'});
        const decided = item.decision !== 'pending';
        const tone = {approved: 'ok', declined: 'bad', expired: 'warn', stopped: 'warn'}[item.decision] || 'warn';
        return h('div', {class: 'step approval', role: 'group', 'aria-label': 'Approval request'},
          h('div', {class: 'row'}, h('strong', {}, decided ? 'Change request' : 'Claude asks to change the lab'), h('span', {class: `badge ${tone}`}, item.decision), time),
          h('dl', {}, h('dt', {}, 'Action'), h('dd', {}, h('code', {}, item.action)),
            h('dt', {}, 'Reason'), h('dd', {}, details.reason || '—'),
            h('dt', {}, 'Expected effect'), h('dd', {}, details.expected_effect || '—'),
            h('dt', {}, 'Cleanup'), h('dd', {}, details.cleanup || '—'),
            item.note ? [h('dt', {}, 'Your note'), h('dd', {}, item.note)] : null),
          decided ? null : [note, h('div', {class: 'row', style: 'margin-top:.4rem'},
            h('button', {class: 'primary', type: 'button', onclick: () => decide(item.approval_id, 'approve', note.value)}, 'Approve'),
            h('button', {class: 'danger', type: 'button', onclick: () => decide(item.approval_id, 'deny', note.value)}, 'Decline'))]);
      }
      case 'summary': return h('div', {class: 'step'}, h('strong', {}, 'Changes made in this run'),
        h('ul', {}, item.changes.map(change => h('li', {}, `${change.at}: ${change.description}; cleanup: ${change.cleanup}`))),
        item.unresolved.length ? h('div', {class: 'notice'}, 'Not yet restored: ', item.unresolved.join('; ')) : h('div', {class: 'muted'}, 'No container is left stopped. Check that each Splunk change’s cleanup was done if you wanted it undone.'));
      case 'error': return h('div', {class: 'step error'}, item.text);
      case 'note': return h('div', {class: 'muted'}, item.text);
      default: return null;
    }
  }
  function renderAssistant() {
    if (!assistant.open) return;
    const status = assistant.status;
    const run = assistant.run;
    const usage = [...assistant.events.values()].filter(item => item.type === 'usage');
    const tokens = usage.reduce((sum, item) => [sum[0] + (item.input_tokens || 0), sum[1] + (item.output_tokens || 0)], [0, 0]);
    const runPicker = h('select', {'aria-label': 'Conversation', onchange: event => selectRun(event.target.value || null)},
      h('option', {value: '', selected: !run}, 'New conversation'),
      assistant.runs.map(item => h('option', {value: item.id, selected: run && run.id === item.id}, `${item.origin === 'terminal' ? '⌨ ' : ''}${new Date(item.created_at).toLocaleString()} · ${item.title.slice(0, 50)}`)));
    assistantHead.replaceChildren(
      h('div', {class: 'row'}, h('strong', {style: 'flex:1'}, 'Claude'),
        status ? h('span', {class: 'muted', style: 'font-size:.75rem'}, `${status.model} · effort ${status.effort}`) : null,
        h('button', {class: 'small', type: 'button', onclick: () => setAssistantOpen(false)}, 'Close')),
      runPicker,
      h('div', {class: 'muted', style: 'font-size:.75rem'},
        terminalRun() ? `Claude Code ${liveRun() ? 'working' : 'session'} from the terminal on the lab PC, with its own access; you approve its actions there. This page follows a live session and opens each screen it shows.` : status ? `Reads the lab as ${status.read_account || 'the observer account'}${status.change_account ? `, changes Splunk as ${status.change_account}` : ''}; every change waits for your approval. Open “Evidence sent to Claude” on any step to see exactly what left this workstation.` : '',
        run ? ` · Run ${run.id}, ${run.status.replaceAll('_', ' ')}${usage.length ? `, ${tokens[0].toLocaleString()} in / ${tokens[1].toLocaleString()} out tokens` : ''}` : ''));
    const nearBottom = trail.scrollHeight - trail.scrollTop - trail.clientHeight < 80;
    const steps = [...assistant.events.values()].sort((a, b) => a.seq - b.seq).map(stepNode).filter(Boolean);
    if (liveRun() && assistant.run.status === 'running') steps.push(h('div', {class: 'muted'}, terminalRun() ? 'Claude Code is working in the terminal…' : 'Claude is working…'));
    if (!steps.length) steps.push(h('div', {class: 'muted'}, 'Ask a question about the lab (“Why is p-hq-sh1 red?”), or ask for something to be done (“Restart the alpha indexers one at a time and show me the cluster recovering”). Claude opens the screens it is looking at in this window.'));
    trail.replaceChildren(...steps);
    if (nearBottom) trail.scrollTop = trail.scrollHeight;
    const parts = [];
    if (assistant.error) parts.push(h('div', {class: 'notice'}, assistant.error));
    if (status && !status.sdk_available) parts.push(h('div', {class: 'notice'}, 'The anthropic Python package is not installed for this observer. Start it with the project’s .venv/bin/python.'));
    if (status && !status.configured) {
      const keyInput = h('input', {type: 'password', placeholder: 'sk-ant-…', autocomplete: 'off', 'aria-label': 'Anthropic API key'});
      parts.push(h('div', {}, h('div', {class: 'muted', style: 'margin-bottom:.3rem'}, 'Add an Anthropic API key (console.anthropic.com → API keys). It is saved only on the lab PC in a file only you can read, and never shown again.'),
        keyInput, h('div', {class: 'row', style: 'margin-top:.4rem'}, h('button', {class: 'primary', type: 'button', onclick: () => saveKey(keyInput.value)}, 'Save key'))));
    } else if (status) {
      parts.push(promptInput, h('div', {class: 'row'},
        h('button', {class: 'primary', type: 'button', disabled: assistant.busy || activeRun(), onclick: sendPrompt}, run && !activeRun() && !terminalRun() ? 'Send follow-up' : 'Send'),
        activeRun() ? h('button', {class: 'danger', type: 'button', onclick: async () => { await post(`/observer/api/assistant/runs/${encodeURIComponent(run.id)}/stop`); fetchRun(run.id); }}, 'Stop') : null,
        h('span', {class: 'muted', style: 'font-size:.75rem;flex:1'}, '⌘/Ctrl + Enter to send'),
        h('button', {class: 'small', type: 'button', title: `Key ${status.hint || ''} from ${status.source || ''}`, onclick: () => { if (confirm('Remove the saved Anthropic API key from the lab PC?')) saveKey(''); }}, 'Remove key')));
    }
    composer.replaceChildren(...parts);
  }
  document.getElementById('assistant-toggle').addEventListener('click', () => setAssistantOpen(!assistant.open));
  try { if (localStorage.getItem('assistant-open')) setAssistantOpen(true); } catch (_error) { /* storage unavailable */ }

  // --- wiring -------------------------------------------------------------------------
  for (const button of document.querySelectorAll('nav button')) button.addEventListener('click', () => { tab = button.dataset.tab; render(); });
  document.getElementById('discover').addEventListener('click', async () => { await post('/observer/api/discover'); setTimeout(refresh, 8000); });
  document.getElementById('capture').addEventListener('click', async () => { await post('/observer/api/captures'); refresh(); });
  (async () => {
    await loadLayout();
    await refresh();
    setInterval(refresh, 20000);
  })();
  </script>
</body>
</html>
