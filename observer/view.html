<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Splunk Lab Observer</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b1220; color: #e6edf7; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
    header { display: flex; gap: 1rem; align-items: center; justify-content: space-between; padding: .9rem 1.2rem; border-bottom: 1px solid #344154; }
    h1 { margin: 0; font-size: 1.05rem; }
    .subtitle { color: #a8b5c7; font-size: .85rem; margin-top: .2rem; }
    .actions { display: flex; align-items: center; gap: .7rem; }
    button, a.button { background: #1f3652; color: #f5f8fc; border: 1px solid #55718e; border-radius: .35rem; padding: .45rem .7rem; font: inherit; text-decoration: none; cursor: pointer; }
    button:hover, a.button:hover { background: #2b4b70; }
    #availability { border-radius: 1rem; padding: .3rem .65rem; background: #534516; color: #ffe79a; font-size: .85rem; }
    #availability.available { background: #173f31; color: #a6f3c6; }
    #availability.unavailable { background: #572a2a; color: #ffc0c0; }
    main { padding: 1rem; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: .6rem; }
    .facts { color: #a8b5c7; font-size: .85rem; display: flex; flex-wrap: wrap; gap: 1.2rem; }
    .frame { position: relative; flex: 1; min-height: 16rem; border: 1px solid #344154; border-radius: .5rem; overflow: hidden; background: #f8f9fb; }
    .frame.actual { overflow: auto; }
    iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; background: white; transform-origin: 0 0; }
    select { background: #1f3652; color: #f5f8fc; border: 1px solid #55718e; border-radius: .35rem; padding: .4rem .5rem; font: inherit; }
    #unavailable { display: none; position: absolute; inset: 0; place-items: center; background: #101b2c; color: #ffc0c0; font-size: 1.1rem; }
    .frame.down #unavailable { display: grid; }
    @media (max-width: 700px) { header { align-items: flex-start; flex-direction: column; } .actions { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <header>
    <div><h1>Splunk Lab Observer</h1><div class="subtitle" id="component-name">Checking component…</div></div>
    <div class="actions"><span id="availability" role="status" aria-live="polite">Checking…</span><label><span hidden>View size</span><select id="fit" aria-label="View size"><option value="fit">Whole screen, shrunk to fit</option><option value="actual">Actual size</option></select></label><button id="reload" type="button">Reload view</button><a class="button" href="/en-US/" target="_blank" rel="noopener">Open full screen</a><form id="logout" method="post" action="/observer/logout" hidden><button type="submit">Sign out</button></form></div>
  </header>
  <main>
    <div class="facts"><span id="source">Source: checking</span><span id="view-time">View URL checked: waiting</span><span id="loaded-time">Document loaded: waiting</span><span id="checked">Health checked: checking</span><span id="scale"></span></div>
    <div class="frame" id="frame"><iframe id="component-view" src="/en-US/" title="Live Splunk component screen"></iframe><div id="unavailable">Component unavailable. Check that it is running, then reload.</div></div>
  </main>
  <script>
    const status = document.getElementById('availability');
    const frame = document.getElementById('frame');
    const view = document.getElementById('component-view');
    let componentSource = null;
    function currentViewSource(componentSource) {
      try {
        const location = new URL(view.contentWindow.location.href);
        if (location.origin !== window.location.origin) return null;
        return new URL(location.pathname + location.search + location.hash, componentSource).href;
      } catch (_error) { return null; }
    }
    async function refresh() {
      try {
        const response = await fetch('/observer/api/component', {cache: 'no-store'});
        if (response.status === 401) { window.location.assign('/observer/login'); return; }
        const component = await response.json();
        const available = component.availability === 'available';
        status.textContent = available ? 'Available' : 'Unavailable';
        status.className = component.availability;
        frame.classList.toggle('down', !available);
        document.getElementById('component-name').textContent = component.name;
        document.getElementById('logout').hidden = !component.login_required;
        componentSource = component.source;
        updateViewSource();
        document.getElementById('checked').textContent = 'Health checked: ' + new Date(component.checked_at).toLocaleString();
      } catch (_error) {
        status.textContent = 'Observer unavailable';
        status.className = 'unavailable';
        frame.classList.add('down');
      }
    }
    function updateViewSource() {
      if (!componentSource) return;
      const source = currentViewSource(componentSource);
      document.getElementById('source').textContent = 'Source: ' + (source || componentSource);
      if (source) document.getElementById('view-time').textContent = 'View URL checked: ' + new Date().toLocaleString();
    }
    // Splunk lays out for a desktop window. "Whole screen" renders it at a desktop width
    // and scales it down to the tile, so the full page stays visible and clickable.
    const DESKTOP_WIDTH = 1440;
    const fit = document.getElementById('fit');
    try { fit.value = localStorage.getItem('observer.fit') || 'fit'; } catch (_error) { fit.value = 'fit'; }
    function layoutView() {
      const width = frame.clientWidth, height = frame.clientHeight;
      const shrink = fit.value === 'fit';
      const scale = shrink ? Math.min(1, width / DESKTOP_WIDTH) : 1;
      frame.classList.toggle('actual', !shrink);
      view.style.width = Math.max(DESKTOP_WIDTH, width) + 'px';
      view.style.height = (shrink ? height / scale : Math.max(height, 900)) + 'px';
      view.style.transform = scale < 1 ? `scale(${scale})` : '';
      document.getElementById('scale').textContent = 'Shown at ' + Math.round(scale * 100) + '% of a ' + view.style.width + ' wide window';
    }
    fit.addEventListener('change', () => {
      try { localStorage.setItem('observer.fit', fit.value); } catch (_error) { /* per-device preference only */ }
      layoutView();
    });
    new ResizeObserver(layoutView).observe(frame);
    layoutView();
    document.getElementById('reload').addEventListener('click', () => { view.src = view.src; refresh(); });
    view.addEventListener('load', () => {
      const viewLoadedAt = new Date();
      document.getElementById('loaded-time').textContent = 'Document loaded: ' + viewLoadedAt.toLocaleString();
      refresh();
    });
    refresh();
    setInterval(refresh, 15000);
    setInterval(updateViewSource, 1000);
  </script>
</body>
</html>
