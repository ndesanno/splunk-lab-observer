<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Splunk Lab Observer</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b1220; color: #e6edf7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; gap: 1rem; align-items: center; justify-content: space-between; padding: .9rem 1.2rem; border-bottom: 1px solid #344154; }
    h1 { margin: 0; font-size: 1.05rem; }
    .subtitle { color: #a8b5c7; font-size: .85rem; margin-top: .2rem; }
    .actions { display: flex; align-items: center; gap: .7rem; }
    button, a.button { background: #1f3652; color: #f5f8fc; border: 1px solid #55718e; border-radius: .35rem; padding: .45rem .7rem; font: inherit; text-decoration: none; cursor: pointer; }
    button:hover, a.button:hover { background: #2b4b70; }
    #availability { border-radius: 1rem; padding: .3rem .65rem; background: #534516; color: #ffe79a; font-size: .85rem; }
    #availability.available { background: #173f31; color: #a6f3c6; }
    #availability.unavailable { background: #572a2a; color: #ffc0c0; }
    main { padding: 1rem; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: .6rem; }
    .facts { color: #a8b5c7; font-size: .85rem; display: flex; flex-wrap: wrap; gap: 1.2rem; }
    .frame { position: relative; flex: 1; min-height: 24rem; border: 1px solid #344154; border-radius: .5rem; overflow: hidden; background: #f8f9fb; }
    iframe { width: 100%; height: 100%; border: 0; background: white; }
    #unavailable { display: none; position: absolute; inset: 0; place-items: center; background: #101b2c; color: #ffc0c0; font-size: 1.1rem; }
    .frame.down #unavailable { display: grid; }
    @media (max-width: 700px) { header { align-items: flex-start; flex-direction: column; } .actions { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <header>
    <div><h1>Splunk Lab Observer</h1><div class="subtitle" id="component-name">Checking component…</div></div>
    <div class="actions"><span id="availability" role="status" aria-live="polite">Checking…</span><button id="reload" type="button">Reload view</button><a class="button" href="/en-US/" target="_blank" rel="noopener">Open full screen</a></div>
  </header>
  <main>
    <div class="facts"><span id="source">Source: checking</span><span id="checked">Health checked: checking</span><span id="view-time">View loaded: waiting</span></div>
    <div class="frame" id="frame"><iframe id="component-view" src="/en-US/" title="Live Splunk component screen"></iframe><div id="unavailable">Component unavailable. Check that it is running, then reload.</div></div>
  </main>
  <script>
    const status = document.getElementById('availability');
    const frame = document.getElementById('frame');
    const view = document.getElementById('component-view');
    let viewPath = null;
    let viewLoadedAt = null;
    async function refresh() {
      try {
        const response = await fetch('/observer/api/component', {cache: 'no-store'});
        const component = await response.json();
        const available = component.availability === 'available';
        status.textContent = available ? 'Available' : 'Unavailable';
        status.className = component.availability;
        frame.classList.toggle('down', !available);
        document.getElementById('component-name').textContent = component.name;
        document.getElementById('source').textContent = 'Source: ' + (viewPath ? new URL(viewPath, component.source).href : component.source);
        document.getElementById('checked').textContent = 'Health checked: ' + new Date(component.checked_at).toLocaleString();
        document.getElementById('view-time').textContent = viewLoadedAt ? 'View loaded: ' + viewLoadedAt.toLocaleString() : 'View loaded: waiting';
      } catch (_error) {
        status.textContent = 'Observer unavailable';
        status.className = 'unavailable';
        frame.classList.add('down');
      }
    }
    document.getElementById('reload').addEventListener('click', () => { view.src = view.src; refresh(); });
    view.addEventListener('load', () => {
      viewLoadedAt = new Date();
      try { viewPath = view.contentWindow.location.pathname; }
      catch (_error) { viewPath = null; }
      refresh();
    });
    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
